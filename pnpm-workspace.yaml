packages:
  - packages/core
  - packages/rules
  - packages/schemas
  - packages/nuxt
  - packages/nuxt/client
  - packages/nuxt/test/fixtures
  - packages/shared
  - packages/mcp-server
  - packages-private/regle-playground
  - tests
  - tests/plugin-config-tests
  - docs
  - playground/vue3
  - playground/nuxt
  - playground/advanced-example
  - ui-tests/fixtures/ui-vue3
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true

catalog:
  '@arethetypeswrong/core': 0.18.3
  '@nuxt/devtools-kit': 2.7.0
  '@nuxt/devtools': 2.7.0
  '@nuxt/devtools-ui-kit': 2.7.0
  '@vue/devtools-applet': 7.7.9
  '@vue/devtools-core': 7.7.9
  '@vue/devtools-kit': 7.7.9
  birpc: 2.5.0
  hookable: 5.5.3
  sirv: 3.0.2
  superjson: 2.2.2
  '@nuxt/kit': 4.4.8
  '@nuxt/schema': 4.4.8
  '@pinia/nuxt': 0.11.3
  '@playwright/test': 1.60.0
  '@total-typescript/ts-reset': 0.6.1
  '@types/node': 24.13.2
  '@vitejs/plugin-vue': 6.0.7
  '@vitejs/plugin-vue-jsx': 5.1.5
  '@vue/compiler-dom': 3.5.35
  '@vue/compiler-dom-3.4': npm:@vue/compiler-dom@3.4.38
  '@vue/reactivity': 3.5.35
  '@vue/reactivity-3.4': npm:@vue/reactivity@3.4.38
  '@vue/runtime-core': 3.5.35
  '@vue/runtime-core-3.4': npm:@vue/runtime-core@3.4.38
  '@vue/runtime-dom': 3.5.35
  '@vue/runtime-dom-3.4': npm:@vue/runtime-dom@3.4.38
  '@vue/server-renderer': 3.5.35
  '@vue/server-renderer-3.4': npm:@vue/server-renderer@3.4.38
  '@vue/shared': 3.5.35
  '@vue/shared-3.4': npm:@vue/shared@3.4.38
  '@vue/test-utils': 2.4.11
  arktype: 2.2.0
  check-password-strength: 3.0.0
  nuxt: 4.4.8
  pinia: 3.0.4
  pinia-2.2.5: npm:pinia@2.2.5
  playwright: 1.60.0
  playwright-core: 1.60.0
  publint: 0.3.21
  sass: 1.101.0
  tailwindcss: 4.3.1
  tsdown: 0.22.2
  tsx: 4.22.4
  type-fest: 5.7.0
  # TypeScript 7 native compiler (tsc). Kept under an alias so the `typescript`
  # package can remain the Strada/JS 6.x API for vue-tsc / Volar (the
  # @typescript/typescript6 shim breaks volar's tsc patching).
  # See: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
  '@typescript/native': npm:typescript@7.0.2
  typescript: 6.0.3
  valibot: 1.4.1
  vite: 8.0.16
  vitest: 4.1.8
  vite-plus: 0.2.1
  vite-plugin-vue-devtools: 7.7.9
  vue: 3.5.35
  vue-3.4: npm:vue@3.4.38
  vue-eslint-parser: 10.4.1
  vue-router: 5.1.0
  vue-tsc: 3.3.7
  zod: 4.4.3

engineStrict: true
optimisticRepeatInstall: false
verifyDepsBeforeRun: false
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - tsdown
  - oxlint
  - '@oxlint*'
  - oxfmt*
  - '@oxfmt*'
  - typescript
  - '@typescript/*'
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  # @typescript/native is aliased to npm:typescript@7 for the native tsc CLI, but that
  # second `typescript` package must not fork vue/pinia peer graphs. Pinia's
  # skipHydrate uses a per-module Symbol(); dual pinia copies break Nuxt SSR payload
  # serialization for Regle store state (processShortcuts, etc.).
  'vue>typescript': 'catalog:'
  'pinia>typescript': 'catalog:'
  '@vue/server-renderer>typescript': 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
